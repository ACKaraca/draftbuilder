[package]
name = "draftbuilder-cli"
description = "The headless CLI of DraftBuilder: the shared CLI subcommands over the DraftBuilder type set, a scripting session and a headless render."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arc-app = { workspace = true, features = ["render"] }
arc-base = { workspace = true }
arc-command = { workspace = true, features = ["headless"] }
arc-doc = { workspace = true, features = ["package"] }
arc-gpu = { workspace = true, features = ["draft"] }
draftbuilder-commands = { path = "../../crates/draftbuilder-commands" }
serde_json = { workspace = true }

[dev-dependencies]
# Decodes the PNG files the tests read back.
image = { workspace = true }
# The DWG fixture helper of the foundation, for the DWG open of the partner workflow.
arc-io-dwg = { workspace = true, features = ["testing"] }
# The handles of the objects, for the identity checks of the workflows.
draftbuilder-model = { path = "../../crates/draftbuilder-model" }

[lints]
workspace = true
